<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Kendryx Soriano</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: local('Neue Haas Grotesk Text'), local('NeueHaasGrotesk-Text'),
           local('Neue Haas Grotesk Display'), local('NeueHaasGrotesk');
    }

    :root {
      --font: 'Neue Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --nav-h: 64px;
      --black: #111;
      --grey: #999;
      --light: #f5f5f3;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      color: var(--black);
      background: #fff;
      overflow-x: hidden;
    }

        /* ── NAV ──────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
      z-index: 100;
    }

    .nav-logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--black);
      text-decoration: none;
      display: inline-block;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .nav-logo:hover {
      color: var(--grey);
      transform: translateY(-2px);
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-family: "neue-haas-grotesk-display-pr", sans-serif;
      font-size: 13px;
      font-weight: 500;
      font-style: normal;
      letter-spacing: 0.05em;
      color: var(--black);
      text-decoration: none;
      display: inline-block;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .nav-links a:hover {
      color: var(--grey);
      transform: translateY(-3px);
    }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--black); transition: all 0.3s ease; }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); padding: 24px 40px 32px; z-index: 99; border-bottom: 1px solid rgba(0,0,0,0.07); flex-direction: column; gap: 24px; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { font-size: 18px; font-weight: 300; color: var(--black); text-decoration: none; letter-spacing: 0.01em; transition: color 0.3s ease; }
    .mobile-menu a:hover { color: var(--grey); }

    /* PAGE HEADER */
    .page-header {
      padding: calc(var(--nav-h) + 80px) 40px 60px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .page-header h1 {
      font-size: clamp(40px, 7vw, 88px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    /* EMBED */
    .embed-wrapper {
      padding: 60px 80px 80px;
      display: flex;
      flex-direction: column;
    }

    .issuu-container {
      position: relative;
      padding-top: 46%;
      width: 100%;
    }

    .issuu-container iframe {
      position: absolute;
      border: none;
      width: 100%;
      height: 100%;
      left: 0; top: 0;
    }

    /* FOOTER */
    footer {
      padding: 28px 40px;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .footer-copy { font-size: 12px; color: var(--grey); letter-spacing: 0.01em; }
    .footer-socials { display: flex; gap: 16px; align-items: center; }
    .footer-socials a { display: inline-flex; align-items: center; color: var(--grey); transition: color 0.3s ease, transform 0.3s ease; }
    .footer-socials a:hover { color: var(--black); transform: translateY(-3px); }
    .footer-socials svg { width: 20px; height: 20px; }
    .footer-email { font-size: 12px; color: var(--grey); text-decoration: none; letter-spacing: 0.01em; display: inline-block; transition: color 0.3s ease, transform 0.3s ease; }
    .footer-email:hover { color: var(--black); transform: translateY(-3px); }

    @media (max-width: 1024px) {
      .embed-wrapper { padding: 48px 48px 64px; }
    }
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .embed-wrapper { padding: 36px 20px 48px; }
      footer { flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 20px; }
    }
  
    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 560px;
      margin: 20px;
      padding: 56px 52px 48px;
      position: relative;
      transform: translateY(24px);
      transition: transform 0.35s ease;
    }
    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 24px;
      right: 28px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: var(--grey);
      line-height: 1;
      transition: color 0.2s ease, transform 0.2s ease;
      font-family: var(--font);
    }
    .modal-close:hover { color: var(--black); transform: rotate(90deg); }

    .modal-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 16px;
    }

    .modal-heading {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 40px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .form-field input,
    .form-field textarea {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      color: var(--black);
      background: none;
      border: none;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      padding: 8px 0;
      outline: none;
      width: 100%;
      transition: border-color 0.2s ease;
      resize: none;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-bottom-color: var(--black);
    }

    .form-field input::placeholder,
    .form-field textarea::placeholder {
      color: rgba(0,0,0,0.25);
    }

    .form-field textarea {
      min-height: 100px;
    }

    .modal-submit {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: var(--black);
      border: none;
      padding: 16px 24px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .modal-submit:hover { background: #333; transform: translateY(-2px); }

    @media (max-width: 480px) {
      .modal { padding: 48px 28px 40px; }
      .form-row { grid-template-columns: 1fr; }
    }

    /* ── DESIGN TOUCHUP ─────────────────────────── */
    .page-veil { position: fixed; inset: 0; background: #fff; z-index: 9990; pointer-events: none; animation: veilOut 0.55s ease forwards; }
    @keyframes veilOut { to { opacity: 0; visibility: hidden; } }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
    .reveal.in { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="page-veil"></div>

<nav>
  <a class="nav-logo" href="index.html">Kendryx Soriano</a>
  <ul class="nav-links">
    <li><a href="works.html">Works</a></li>
    <li><a href="portfolio.html">Portfolio</a></li>
    <li><a href="about.html">About Me</a></li>
    <li><a href="resume.html">Résumé</a></li>
    <li><a href="#" data-modal>Let's Talk</a></li>
  </ul>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="works.html">Works</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="about.html">About Me</a>
  <a href="resume.html">Résumé</a>

<div class="page-header">

</div>

<div class="embed-wrapper">

    <iframe
      title="Unconventional Conventions"
      allow="clipboard-write; autoplay; encrypted-media; fullscreen; picture-in-picture"

      allowfullscreen="true"
      src="https://e.issuu.com/embed.html?d=unconventional_conventions&u=kendryxsoriano">

</div>

<footer>
  <span class="footer-copy">© 2026 Kendryx Soriano</span>
  <div class="footer-socials">
    <a href="https://www.instagram.com/kendryxsoriano/" target="_blank" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>

    <a href="https://www.linkedin.com/in/kendryxsoriano" target="_blank" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

<script>
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });

  // Modal logic
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Wire up all Let's Talk / Get in touch triggers
  document.querySelectorAll('[data-modal]').forEach(el => {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      openModal();
    });
  });

</script>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

      </div>
      <button type="submit" class="modal-submit">
        Send Message <span>&#x2192;</span>
      </button>
    </form>
  </div>
</div>

<script>
(function () {
  var skip = ['nav', '.mobile-menu', '.modal-overlay', '.hero'];
  var sel = 'h1, h2, h3, p, .section-label, .work-card, .portfolio-item, .about-strip-label, .about-strip-location, .principle-row, .btn, .statement-label, .statement-text, .meta-row, .slide-caption, .back-link, .next-link, .download-btn, .resume-image-box, .issuu-container';
  document.querySelectorAll(sel).forEach(function (el) {
    if (skip.some(function (s) { return el.closest(s); })) return;
    el.classList.add('reveal');
  });
  var io = new IntersectionObserver(function (entries) {
    var visible = entries.filter(function (e) { return e.isIntersecting; });
    visible.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    visible.forEach(function (entry, i) {
      entry.target.style.transitionDelay = (i * 150) + 'ms';
      entry.target.classList.add('in');
      io.unobserve(entry.target);
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
})();
</script>
</body>
